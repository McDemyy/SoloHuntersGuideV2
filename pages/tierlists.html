<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tier Lists | Solo Hunters System DB</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#00000f;--border:rgba(0,212,255,0.15);--cyan:#00d4ff;--purple:#7b2fff;--red:#ff2a4a;--gold:#ffd700;--ice:#4db8ff;--text:rgba(180,210,240,0.85);--text-dim:rgba(120,160,200,0.5);}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);font-family:'Rajdhani',sans-serif;color:var(--text);min-height:100vh;overflow-x:hidden;}
    .bg-layer{position:fixed;inset:0;z-index:0;pointer-events:none;}
    .bg-radial{background:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(123,47,255,0.14) 0%,transparent 70%),radial-gradient(ellipse 50% 40% at 80% 100%,rgba(0,212,255,0.07) 0%,transparent 60%);}
    .bg-grid{background-image:linear-gradient(rgba(0,212,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.03) 1px,transparent 1px);background-size:48px 48px;animation:gd 40s linear infinite alternate;}
    @keyframes gd{from{background-position:0 0}to{background-position:48px 48px}}
    .bg-scanlines{background:repeating-linear-gradient(0deg,transparent 0px,transparent 3px,rgba(0,0,0,0.07) 3px,rgba(0,0,0,0.07) 4px);opacity:.5;}
    .navbar{position:fixed;top:0;left:0;right:0;z-index:1000;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;background:rgba(0,0,8,0.9);border-bottom:1px solid var(--border);backdrop-filter:blur(16px);}
    .nav-logo{font-family:'Orbitron',monospace;font-size:11px;font-weight:900;letter-spacing:3px;text-transform:uppercase;color:var(--cyan);text-decoration:none;text-shadow:0 0 20px rgba(0,212,255,0.7);}
    .nav-links{display:flex;gap:8px;}
    .nav-btn{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;padding:5px 14px;color:var(--cyan);text-decoration:none;border:1px solid rgba(0,212,255,0.25);border-radius:3px;background:rgba(0,212,255,0.04);transition:all .2s;}
    .nav-btn:hover{background:rgba(0,212,255,0.12);border-color:var(--cyan);box-shadow:0 0 14px rgba(0,212,255,0.3);}
    .page{position:relative;z-index:1;padding:80px 24px 80px;max-width:700px;margin:0 auto;}
    .page-header{text-align:center;padding:40px 0 48px;}
    .sys-tag{display:inline-block;font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:4px;text-transform:uppercase;color:var(--cyan);border:1px solid rgba(0,212,255,0.3);padding:4px 18px;border-radius:2px;margin-bottom:18px;animation:tp 2s ease-in-out infinite;}
    @keyframes tp{0%,100%{opacity:1}50%{opacity:.5}}
    .page-title{font-family:'Orbitron',monospace;font-size:clamp(28px,6vw,52px);font-weight:900;letter-spacing:6px;text-transform:uppercase;color:#fff;text-shadow:0 0 40px rgba(0,212,255,0.35);margin-bottom:8px;}
    .page-sub{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--text-dim);}
    .header-line{width:260px;height:1px;margin:18px auto 0;background:linear-gradient(90deg,transparent,var(--cyan),var(--purple),transparent);}
    .tier-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:8px;}
    @media(max-width:520px){.tier-grid{grid-template-columns:1fr;}}
    .tier-btn{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:28px 24px;text-decoration:none;background:linear-gradient(135deg,rgba(6,10,22,.97),rgba(10,6,20,.97));border:1px solid rgba(0,212,255,0.18);border-radius:8px;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s,border-color .2s;animation:fadeUp .6s ease both;}
    .tier-btn::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,212,255,.3),transparent);}
    .tier-btn::after{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(0,212,255,.04),transparent);transition:left .5s;}
    .tier-btn:hover{transform:translateY(-5px);border-color:rgba(0,212,255,.45);box-shadow:0 12px 40px rgba(0,212,255,.12);}
    .tier-btn:hover::after{left:150%;}
    .tier-btn.d1{animation-delay:.1s;}.tier-btn.d2{animation-delay:.2s;}
    .corner{position:absolute;width:8px;height:8px;}
    .corner.tl{top:0;left:0;border-top:1px solid rgba(0,212,255,.5);border-left:1px solid rgba(0,212,255,.5);}
    .corner.tr{top:0;right:0;border-top:1px solid rgba(0,212,255,.5);border-right:1px solid rgba(0,212,255,.5);}
    .corner.bl{bottom:0;left:0;border-bottom:1px solid rgba(0,212,255,.5);border-left:1px solid rgba(0,212,255,.5);}
    .corner.br{bottom:0;right:0;border-bottom:1px solid rgba(0,212,255,.5);border-right:1px solid rgba(0,212,255,.5);}
    .btn-icon{font-family:'Share Tech Mono',monospace;font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--cyan);opacity:.5;padding:3px 10px;border:1px solid rgba(0,212,255,.2);border-radius:2px;}
    .btn-label{font-family:'Orbitron',monospace;font-size:15px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:#fff;text-shadow:0 0 20px rgba(255,255,255,.15);}
    .btn-desc{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);}
    .btn-arrow{position:absolute;bottom:20px;right:20px;font-family:'Share Tech Mono',monospace;font-size:14px;color:rgba(0,212,255,.3);transition:color .2s,transform .2s;}
    .tier-btn:hover .btn-arrow{color:var(--cyan);transform:translateX(4px);}
    @keyframes fadeUp{to{opacity:1;transform:none;}}.tier-btn{opacity:0;transform:translateY(20px);}
  </style>
</head>
<body>
  <div class="bg-layer bg-radial"></div>
  <div class="bg-layer bg-grid"></div>
  <div class="bg-layer bg-scanlines"></div>
  <nav class="navbar">
    <a href="../index.html" class="nav-logo">⚔ SH System DB</a>
    <div class="nav-links">
      <a href="../index.html" class="nav-btn">← Home</a>
    </div>
  </nav>
  <div class="page">
    <header class="page-header">
      <div class="sys-tag">[ SYSTEM — TIERLISTS MODULE ]</div>
      <h1 class="page-title">Tier Lists</h1>
      <p class="page-sub">Choose a category below</p>
      <div class="header-line"></div>
    </header>
    <div class="tier-grid">
      <a href="weaponstier.html" class="tier-btn d1">
        <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
        <span class="btn-icon">[ Weapons ]</span>
        <span class="btn-label">Weapon Tier List</span>
        <span class="btn-desc">All weapons ranked by power</span>
        <span class="btn-arrow">›</span>
      </a>
      <a href="magic.html" class="tier-btn d2">
        <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
        <span class="btn-icon">[ Magic ]</span>
        <span class="btn-label">Magic Tier List</span>
        <span class="btn-desc">All abilities ranked by power</span>
        <span class="btn-arrow">›</span>
      </a>
    </div>
  </div>
</body>
</html>
