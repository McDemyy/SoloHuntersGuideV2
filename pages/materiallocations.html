<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Material Locations | Solo Hunters System DB</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cyan:   #00d4ff;
      --purple: #7b2fff;
      --red:    #ff2a4a;
      --gold:   #ffd700;
      --green:  #00ff9f;
      --dark:   #04060f;

      /* Gate colors */
      --c-subway:     #00d4ff;
      --c-caves:      #00ffb4;
      --c-jungle:     #00e060;
      --c-desert:     #ffd700;
      --c-snowforest: #a0dcff;
      --c-spidercave: #ff2a4a;
      --c-bloodmoons: #cc44ff;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: var(--dark); font-family: 'Share Tech Mono', monospace; color: #c8deff; overflow-x: hidden; min-height: 100vh; }

    /* ── BG ── */
    .bg-grid { position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(0,212,255,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.04) 1px,transparent 1px);background-size:48px 48px;animation:grid-drift 40s linear infinite alternate; }
    @keyframes grid-drift{from{background-position:0 0}to{background-position:48px 48px}}
    .bg-vignette { position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 50% 0%,rgba(123,47,255,0.1) 0%,transparent 60%),radial-gradient(ellipse at 50% 100%,rgba(0,212,255,0.07) 0%,transparent 60%); }
    .scanlines { position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.025;background:repeating-linear-gradient(0deg,#000 0,#000 1px,transparent 1px,transparent 3px); }

    /* ── NAVBAR ── */
    .navbar { position:fixed;top:0;left:0;right:0;z-index:1000;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:rgba(4,6,15,0.92);border-bottom:1px solid rgba(0,212,255,0.12);backdrop-filter:blur(16px); }
    .nav-logo { font-family:'Orbitron',monospace;font-size:11px;font-weight:900;letter-spacing:3px;color:var(--cyan);text-decoration:none;text-transform:uppercase;text-shadow:0 0 16px rgba(0,212,255,0.6); }
    .nav-links { display:flex;gap:8px;flex-wrap:wrap; }
    .nav-btn { font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:5px 12px;color:var(--cyan);text-decoration:none;border:1px solid rgba(0,212,255,0.25);border-radius:3px;background:rgba(0,212,255,0.04);transition:all 0.2s;white-space:nowrap; }
    .nav-btn:hover { background:rgba(0,212,255,0.12);border-color:var(--cyan);box-shadow:0 0 10px rgba(0,212,255,0.25); }
    @media(max-width:520px) { .nav-links { gap:4px; } .nav-btn { font-size:9px; padding:4px 8px; } }

    /* ── PAGE ── */
    .page { position:relative;z-index:1;padding:80px 0 100px; }
    .container { max-width:1100px;margin:0 auto;padding:0 20px; }

    /* ── HEADER ── */
    .page-header { text-align:center;padding:0 0 48px; }
    .system-tag { display:inline-flex;align-items:center;gap:8px;font-size:9px;letter-spacing:4px;text-transform:uppercase;color:var(--cyan);border:1px solid rgba(0,212,255,0.28);padding:4px 16px;border-radius:2px;margin-bottom:18px;background:rgba(0,212,255,0.04);animation:tag-blink 3s ease-in-out infinite; }
    .tag-dot { width:5px;height:5px;border-radius:50%;background:var(--cyan);box-shadow:0 0 6px var(--cyan);animation:tag-blink 1s ease-in-out infinite; }
    @keyframes tag-blink{0%,100%{opacity:1}50%{opacity:0.5}}
    .page-title { font-family:'Orbitron',monospace;font-size:clamp(26px,7vw,50px);font-weight:900;letter-spacing:5px;text-transform:uppercase;color:#fff;text-shadow:0 0 30px rgba(0,212,255,0.5),0 0 60px rgba(0,212,255,0.15);margin-bottom:10px; }
    .page-subtitle { font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:rgba(140,180,220,0.5); }
    .header-line { width:200px;height:1px;margin:22px auto 0;background:linear-gradient(90deg,transparent,var(--cyan),var(--purple),transparent); }

    /* ── MODE TOGGLE ── */
    .mode-toggle {
      display:flex;justify-content:center;gap:0;
      margin-bottom:44px;
      border:1px solid rgba(0,212,255,0.2);
      border-radius:5px;
      overflow:hidden;
      width:fit-content;
      margin-left:auto;margin-right:auto;
    }
    .mode-btn {
      font-family:'Share Tech Mono',monospace;
      font-size:10px;letter-spacing:2px;text-transform:uppercase;
      padding:10px 28px;
      background:transparent;
      border:none;
      color:rgba(140,180,220,0.45);
      cursor:pointer;
      transition:all 0.2s;
      position:relative;
    }
    .mode-btn + .mode-btn { border-left:1px solid rgba(0,212,255,0.2); }
    .mode-btn.active {
      background:rgba(0,212,255,0.1);
      color:var(--cyan);
      text-shadow:0 0 10px rgba(0,212,255,0.4);
    }
    .mode-btn.active::after {
      content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
      background:linear-gradient(90deg,transparent,var(--cyan),transparent);
    }

    /* ── SECTION PANELS ── */
    .view-panel { display:none; }
    .view-panel.active { display:block; }

    /* ════════════════════════════
       VIEW A: ARTIFACT-FIRST
    ════════════════════════════ */
    .artifacts-grid {
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));
      gap:20px;
    }

    .artifact-card {
      position:relative;
      background:linear-gradient(135deg,rgba(8,12,28,0.97),rgba(10,6,22,0.97));
      border:1px solid rgba(0,212,255,0.12);
      border-radius:6px;
      overflow:hidden;
      cursor:pointer;
      transition:transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      opacity:0;transform:translateY(16px);
    }
    .artifact-card.visible { opacity:1;transform:translateY(0);transition:opacity 0.4s ease,transform 0.4s ease,border-color 0.2s,box-shadow 0.2s; }
    .artifact-card::before { content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,212,255,0.3),transparent); }
    .artifact-card:hover { transform:translateY(-4px);border-color:rgba(0,212,255,0.35);box-shadow:0 8px 28px rgba(0,212,255,0.1); }

    .gc { position:absolute;width:7px;height:7px;pointer-events:none;z-index:2;border-color:rgba(0,212,255,0.4) !important; }
    .gc.tl{top:-1px;left:-1px;border-top:1.5px solid;border-left:1.5px solid;}
    .gc.tr{top:-1px;right:-1px;border-top:1.5px solid;border-right:1.5px solid;}
    .gc.bl{bottom:-1px;left:-1px;border-bottom:1.5px solid;border-left:1.5px solid;}
    .gc.br{bottom:-1px;right:-1px;border-bottom:1.5px solid;border-right:1.5px solid;}

    .artifact-img-wrap {
      display:flex;align-items:center;justify-content:center;
      height:110px;
      background:rgba(0,0,0,0.2);
      border-bottom:1px solid rgba(0,212,255,0.06);
      position:relative;
    }
    .artifact-img {
      width:72px;height:72px;object-fit:contain;
      animation:float-idle 4s ease-in-out infinite;
      filter:drop-shadow(0 0 12px rgba(0,212,255,0.3));
    }
    @keyframes float-idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    .artifact-card:hover .artifact-img { animation-play-state:paused;transform:scale(1.08); }

    .artifact-card-body { padding:14px 16px 16px; }
    .artifact-card-name { font-family:'Orbitron',monospace;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#fff;margin-bottom:12px; }
    .artifact-dungeons { display:flex;flex-direction:column;gap:5px; }
    .dungeon-tag {
      display:inline-flex;align-items:center;gap:7px;
      font-size:9px;letter-spacing:1.5px;text-transform:uppercase;
      padding:4px 10px;border-radius:3px;
      border:1px solid;
      text-decoration:none;
      transition:all 0.2s;
      width:fit-content;
    }
    .dungeon-tag:hover { filter:brightness(1.3);transform:translateX(3px); }
    .dungeon-tag-dot { width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0; }

    /* ════════════════════════════
       VIEW B: DUNGEON-FIRST (MATRIX)
    ════════════════════════════ */

    /* Dungeon filter tabs */
    .dungeon-tabs {
      display:flex;gap:8px;flex-wrap:wrap;justify-content:center;
      margin-bottom:32px;
    }
    .dungeon-tab {
      display:flex;align-items:center;gap:7px;
      font-family:'Share Tech Mono',monospace;
      font-size:9px;letter-spacing:2px;text-transform:uppercase;
      padding:7px 16px;
      border-radius:3px;
      border:1px solid;
      background:transparent;
      cursor:pointer;
      transition:all 0.2s;
      opacity:0.5;
    }
    .dungeon-tab.active { opacity:1; }
    .dungeon-tab:hover { opacity:0.85; }
    .dungeon-tab-dot { width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0; }

    /* Results area */
    .matrix-result {
      max-width:780px;margin:0 auto;
      min-height:180px;
      display:flex;flex-direction:column;gap:0;
    }

    .matrix-gate-header {
      display:flex;align-items:center;gap:16px;
      padding:20px 24px 18px;
      border-radius:6px 6px 0 0;
      border:1px solid;
      border-bottom:none;
      background:rgba(0,0,0,0.25);
      position:relative;overflow:hidden;
    }
    .matrix-gate-header::before { content:'';position:absolute;inset:0;opacity:0.03; }
    .matrix-gate-dot { width:14px;height:14px;border-radius:50%;border:2px solid;flex-shrink:0; }
    .matrix-gate-dot::after { content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:6px;height:6px;border-radius:50%;background:currentColor; }
    .matrix-gate-dot { position:relative; }
    .matrix-gate-title { font-family:'Orbitron',monospace;font-size:14px;font-weight:900;letter-spacing:3px;text-transform:uppercase; }
    .matrix-gate-sub { font-size:9px;letter-spacing:2px;text-transform:uppercase;opacity:0.5;margin-top:2px; }
    .matrix-gate-link {
      margin-left:auto;
      font-size:9px;letter-spacing:1.5px;text-transform:uppercase;
      padding:5px 14px;border-radius:3px;border:1px solid;
      text-decoration:none;
      transition:all 0.2s;
      white-space:nowrap;
      flex-shrink:0;
    }
    .matrix-gate-link:hover { filter:brightness(1.3); }

    .matrix-artifacts-list {
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
      gap:1px;
      border:1px solid;
      border-radius:0 0 6px 6px;
      overflow:hidden;
      background:rgba(255,255,255,0.03);
    }

    .matrix-artifact-item {
      display:flex;flex-direction:column;align-items:center;gap:10px;
      padding:20px 16px;
      background:rgba(4,6,15,0.6);
      transition:background 0.2s;
      cursor:pointer;
      text-decoration:none;
    }
    .matrix-artifact-item:hover { background:rgba(0,212,255,0.06); }
    .matrix-artifact-img { width:52px;height:52px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(0,212,255,0.25)); }
    .matrix-artifact-name { font-size:9px;letter-spacing:1px;text-transform:uppercase;color:rgba(180,210,255,0.7);text-align:center;line-height:1.4; }

    .matrix-empty {
      padding:40px;text-align:center;
      border:1px solid rgba(0,212,255,0.1);border-radius:6px;
      font-size:10px;letter-spacing:2px;text-transform:uppercase;
      color:rgba(140,180,220,0.3);
    }
    .matrix-empty-icon { font-size:28px;margin-bottom:12px;display:block; }

    /* ── GATE COLOR UTILITIES ── */
    .gate-color-subway     { color:var(--c-subway); border-color:rgba(0,212,255,0.35); }
    .gate-color-caves      { color:var(--c-caves); border-color:rgba(0,255,180,0.35); }
    .gate-color-jungle     { color:var(--c-jungle); border-color:rgba(0,224,96,0.35); }
    .gate-color-desert     { color:var(--c-desert); border-color:rgba(255,215,0,0.35); }
    .gate-color-snowforest { color:var(--c-snowforest); border-color:rgba(160,220,255,0.35); }
    .gate-color-spidercave { color:var(--c-spidercave); border-color:rgba(255,42,74,0.35); }
    .gate-color-bloodmoons { color:var(--c-bloodmoons); border-color:rgba(204,68,255,0.35); }

    .dungeon-tag.subway     { color:var(--c-subway);border-color:rgba(0,212,255,0.3);background:rgba(0,212,255,0.06); }
    .dungeon-tag.caves      { color:var(--c-caves);border-color:rgba(0,255,180,0.3);background:rgba(0,255,180,0.06); }
    .dungeon-tag.jungle     { color:var(--c-jungle);border-color:rgba(0,224,96,0.3);background:rgba(0,224,96,0.06); }
    .dungeon-tag.desert     { color:var(--c-desert);border-color:rgba(255,215,0,0.3);background:rgba(255,215,0,0.06); }
    .dungeon-tag.snowforest { color:var(--c-snowforest);border-color:rgba(160,220,255,0.3);background:rgba(160,220,255,0.06); }
    .dungeon-tag.spidercave { color:var(--c-spidercave);border-color:rgba(255,42,74,0.3);background:rgba(255,42,74,0.06); }
    .dungeon-tag.bloodmoons { color:var(--c-bloodmoons);border-color:rgba(204,68,255,0.3);background:rgba(204,68,255,0.06); }

    .matrix-gate-header.subway     { border-color:rgba(0,212,255,0.25); }
    .matrix-gate-header.caves      { border-color:rgba(0,255,180,0.25); }
    .matrix-gate-header.jungle     { border-color:rgba(0,224,96,0.25); }
    .matrix-gate-header.desert     { border-color:rgba(255,215,0,0.25); }
    .matrix-gate-header.snowforest { border-color:rgba(160,220,255,0.25); }
    .matrix-gate-header.spidercave { border-color:rgba(255,42,74,0.25); }
    .matrix-gate-header.bloodmoons { border-color:rgba(204,68,255,0.25); }

    .matrix-artifacts-list.subway     { border-color:rgba(0,212,255,0.12); }
    .matrix-artifacts-list.caves      { border-color:rgba(0,255,180,0.12); }
    .matrix-artifacts-list.jungle     { border-color:rgba(0,224,96,0.12); }
    .matrix-artifacts-list.desert     { border-color:rgba(255,215,0,0.12); }
    .matrix-artifacts-list.snowforest { border-color:rgba(160,220,255,0.12); }
    .matrix-artifacts-list.spidercave { border-color:rgba(255,42,74,0.12); }
    .matrix-artifacts-list.bloodmoons { border-color:rgba(204,68,255,0.12); }

    /* Dungeon tab button accent colors */
    .dungeon-tab.subway     { color:var(--c-subway);border-color:rgba(0,212,255,0.3); }
    .dungeon-tab.caves      { color:var(--c-caves);border-color:rgba(0,255,180,0.3); }
    .dungeon-tab.jungle     { color:var(--c-jungle);border-color:rgba(0,224,96,0.3); }
    .dungeon-tab.desert     { color:var(--c-desert);border-color:rgba(255,215,0,0.3); }
    .dungeon-tab.snowforest { color:var(--c-snowforest);border-color:rgba(160,220,255,0.3); }
    .dungeon-tab.spidercave { color:var(--c-spidercave);border-color:rgba(255,42,74,0.3); }
    .dungeon-tab.bloodmoons { color:var(--c-bloodmoons);border-color:rgba(204,68,255,0.3); }
    .dungeon-tab.active.subway     { background:rgba(0,212,255,0.1); }
    .dungeon-tab.active.caves      { background:rgba(0,255,180,0.1); }
    .dungeon-tab.active.jungle     { background:rgba(0,224,96,0.1); }
    .dungeon-tab.active.desert     { background:rgba(255,215,0,0.1); }
    .dungeon-tab.active.snowforest { background:rgba(160,220,255,0.1); }
    .dungeon-tab.active.spidercave { background:rgba(255,42,74,0.1); }
    .dungeon-tab.active.bloodmoons { background:rgba(204,68,255,0.1); }

    /* ── MOBILE ── */
    @media(max-width:600px) {
      .artifacts-grid { grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px; }
      .matrix-gate-header { flex-wrap:wrap;gap:10px; }
      .matrix-gate-link { margin-left:0; }
      .matrix-artifacts-list { grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); }
    }
    @media(max-width:400px) {
      .artifacts-grid { grid-template-columns:1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-vignette"></div>
  <div class="scanlines"></div>

  <nav class="navbar">
    <a href="../index.html" class="nav-logo">⚔ SH System DB</a>
    <div class="nav-links">
      <a href="../index.html" class="nav-btn">⬅ Home</a>
      <a href="artifacts.html" class="nav-btn">Artifacts</a>
      <a href="levelguide.html" class="nav-btn">Gate Info</a>
    </div>
  </nav>

  <div class="page">
    <div class="container">

      <header class="page-header">
        <div class="system-tag"><span class="tag-dot"></span>Database — Crafting Module<span class="tag-dot"></span></div>
        <h1 class="page-title">Material Locations</h1>
        <p class="page-subtitle">Find where to farm materials for every craftable artifact ring</p>
        <div class="header-line"></div>
      </header>

      <!-- Mode Toggle -->
      <div class="mode-toggle">
        <button class="mode-btn active" data-view="artifact">◈ By Artifact</button>
        <button class="mode-btn" data-view="dungeon">⬡ By Dungeon</button>
      </div>

      <!-- ══ VIEW A: BY ARTIFACT ══ -->
      <div class="view-panel active" id="view-artifact">
        <div class="artifacts-grid" id="artifact-grid">

          <!-- Guardian -->
          <div class="artifact-card">
            <span class="gc tl"></span><span class="gc tr"></span><span class="gc bl"></span><span class="gc br"></span>
            <div class="artifact-img-wrap">
              <img class="artifact-img" src="../images/Artifacts/Guardian.png" alt="Guardian" />
            </div>
            <div class="artifact-card-body">
              <div class="artifact-card-name">Guardian</div>
              <div class="artifact-dungeons">
                <a href="levelguide.html#spidercave" class="dungeon-tag spidercave">
                  <span class="dungeon-tag-dot"></span>Spider Cave
                </a>
                <a href="levelguide.html#jungle" class="dungeon-tag jungle">
                  <span class="dungeon-tag-dot"></span>Jungle
                </a>
              </div>
            </div>
          </div>

          <!-- ShadowFang -->
          <div class="artifact-card">
            <span class="gc tl"></span><span class="gc tr"></span><span class="gc bl"></span><span class="gc br"></span>
            <div class="artifact-img-wrap">
              <img class="artifact-img" src="../images/Artifacts/ShadowFang.png" alt="ShadowFang" />
            </div>
            <div class="artifact-card-body">
              <div class="artifact-card-name">ShadowFang</div>
              <div class="artifact-dungeons">
                <a href="levelguide.html#caves" class="dungeon-tag caves">
                  <span class="dungeon-tag-dot"></span>Caves
                </a>
                <a href="levelguide.html#spidercave" class="dungeon-tag spidercave">
                  <span class="dungeon-tag-dot"></span>Spider Cave
                </a>
                <a href="levelguide.html#bloodmoons" class="dungeon-tag bloodmoons">
                  <span class="dungeon-tag-dot"></span>Bloodmoons
                </a>
              </div>
            </div>
          </div>

          <!-- Deathwing -->
          <div class="artifact-card">
            <span class="gc tl"></span><span class="gc tr"></span><span class="gc bl"></span><span class="gc br"></span>
            <div class="artifact-img-wrap">
              <img class="artifact-img" src="../images/Artifacts/Deathwing.png" alt="Deathwing" />
            </div>
            <div class="artifact-card-body">
              <div class="artifact-card-name">Deathwing</div>
              <div class="artifact-dungeons">
                <a href="levelguide.html#subway" class="dungeon-tag subway">
                  <span class="dungeon-tag-dot"></span>Subway
                </a>
                <a href="levelguide.html#desert" class="dungeon-tag desert">
                  <span class="dungeon-tag-dot"></span>Desert
                </a>
              </div>
            </div>
          </div>

          <!-- Conqurers -->
          <div class="artifact-card">
            <span class="gc tl"></span><span class="gc tr"></span><span class="gc bl"></span><span class="gc br"></span>
            <div class="artifact-img-wrap">
              <img class="artifact-img" src="../images/Artifacts/Conqurers.png" alt="Conqurers" />
            </div>
            <div class="artifact-card-body">
              <div class="artifact-card-name">Conqurers</div>
              <div class="artifact-dungeons">
                <a href="levelguide.html#caves" class="dungeon-tag caves">
                  <span class="dungeon-tag-dot"></span>Caves
                </a>
                <a href="levelguide.html#desert" class="dungeon-tag desert">
                  <span class="dungeon-tag-dot"></span>Desert
                </a>
              </div>
            </div>
          </div>

          <!-- HeartBound -->
          <div class="artifact-card">
            <span class="gc tl"></span><span class="gc tr"></span><span class="gc bl"></span><span class="gc br"></span>
            <div class="artifact-img-wrap">
              <img class="artifact-img" src="../images/Artifacts/HeartBound.png" alt="HeartBound" />
            </div>
            <div class="artifact-card-body">
              <div class="artifact-card-name">HeartBound</div>
              <div class="artifact-dungeons">
                <a href="levelguide.html#snowforest" class="dungeon-tag snowforest">
                  <span class="dungeon-tag-dot"></span>Snow Forest
                </a>
                <a href="levelguide.html#jungle" class="dungeon-tag jungle">
                  <span class="dungeon-tag-dot"></span>Jungle
                </a>
              </div>
            </div>
          </div>

        </div>
      </div>

      <!-- ══ VIEW B: BY DUNGEON ══ -->
      <div class="view-panel" id="view-dungeon">

        <div class="dungeon-tabs" id="dungeon-tabs">
          <button class="dungeon-tab subway active" data-dungeon="subway">
            <span class="dungeon-tab-dot"></span>Subway
          </button>
          <button class="dungeon-tab caves" data-dungeon="caves">
            <span class="dungeon-tab-dot"></span>Caves
          </button>
          <button class="dungeon-tab jungle" data-dungeon="jungle">
            <span class="dungeon-tab-dot"></span>Jungle
          </button>
          <button class="dungeon-tab desert" data-dungeon="desert">
            <span class="dungeon-tab-dot"></span>Desert
          </button>
          <button class="dungeon-tab snowforest" data-dungeon="snowforest">
            <span class="dungeon-tab-dot"></span>Snow Forest
          </button>
          <button class="dungeon-tab spidercave" data-dungeon="spidercave">
            <span class="dungeon-tab-dot"></span>Spider Cave
          </button>
          <button class="dungeon-tab bloodmoons" data-dungeon="bloodmoons">
            <span class="dungeon-tab-dot"></span>Bloodmoons
          </button>
        </div>

        <div class="matrix-result" id="matrix-result"></div>
      </div>

    </div>
  </div>

  <script>
    /* ── Data ── */
    const dungeonMeta = {
      subway:     { name:'Subway',      sub:'Lv 0+  ·  Power 0+',        id:'subway',      anchor:'subway' },
      caves:      { name:'Caves',       sub:'Lv 20+  ·  Power 2,600+',   id:'caves',       anchor:'caves' },
      jungle:     { name:'Jungle',      sub:'Lv 80+  ·  Power 11,000+',  id:'jungle',      anchor:'jungle' },
      desert:     { name:'Desert',      sub:'Lv 200+  ·  Power 32,000+', id:'desert',      anchor:'desert' },
      snowforest: { name:'Snow Forest', sub:'Lv 300+  ·  Power 80,000+', id:'snowforest',  anchor:'snowforest' },
      spidercave: { name:'Spider Cave', sub:'Lv 380+  ·  Power 145,000+',id:'spidercave',  anchor:'spidercave' },
      bloodmoons: { name:'Bloodmoons',  sub:'Special Event Gate',         id:'bloodmoons',  anchor:null },
    };

    const artifacts = [
      { id:'guardian',    name:'Guardian',    img:'../images/Artifacts/Guardian.png',    dungeons:['spidercave','jungle'] },
      { id:'shadowfang',  name:'ShadowFang',  img:'../images/Artifacts/ShadowFang.png',  dungeons:['caves','spidercave','bloodmoons'] },
      { id:'deathwing',   name:'Deathwing',   img:'../images/Artifacts/Deathwing.png',   dungeons:['subway','desert'] },
      { id:'conqurers',   name:'Conqurers',   img:'../images/Artifacts/Conqurers.png',   dungeons:['caves','desert'] },
      { id:'heartbound',  name:'HeartBound',  img:'../images/Artifacts/HeartBound.png',  dungeons:['snowforest','jungle'] },
    ];

    /* ── Mode toggle ── */
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('view-' + btn.dataset.view).classList.add('active');
        if (btn.dataset.view === 'dungeon') renderMatrix(document.querySelector('.dungeon-tab.active').dataset.dungeon);
      });
    });

    /* ── Dungeon tabs ── */
    document.querySelectorAll('.dungeon-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.dungeon-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        renderMatrix(tab.dataset.dungeon);
      });
    });

    /* ── Render matrix view ── */
    function renderMatrix(dungeonId) {
      const meta = dungeonMeta[dungeonId];
      const matching = artifacts.filter(a => a.dungeons.includes(dungeonId));
      const result = document.getElementById('matrix-result');

      if (matching.length === 0) {
        result.innerHTML = `<div class="matrix-empty"><span class="matrix-empty-icon">◈</span>No craftable artifacts require materials from ${meta.name}.</div>`;
        return;
      }

      const gateHref = meta.anchor ? `levelguide.html#${meta.anchor}` : null;
      const gateLink = gateHref
        ? `<a href="${gateHref}" class="matrix-gate-link gate-color-${dungeonId}">⬡ Gate Info ›</a>`
        : `<span class="matrix-gate-link gate-color-${dungeonId}" style="opacity:0.3;pointer-events:none;">Special Gate</span>`;

      const items = matching.map(a => `
        <a href="artifacts.html" class="matrix-artifact-item" title="${a.name}">
          <img class="matrix-artifact-img" src="${a.img}" alt="${a.name}" />
          <div class="matrix-artifact-name">${a.name}</div>
        </a>
      `).join('');

      result.innerHTML = `
        <div class="matrix-gate-header ${dungeonId}">
          <div class="matrix-gate-dot gate-color-${dungeonId}"></div>
          <div>
            <div class="matrix-gate-title gate-color-${dungeonId}">${meta.name}</div>
            <div class="matrix-gate-sub">${meta.sub}</div>
          </div>
          ${gateLink}
        </div>
        <div class="matrix-artifacts-list ${dungeonId}">
          ${items}
        </div>
        <div style="margin-top:12px;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(140,180,220,0.35);text-align:center;">
          ${matching.length} artifact${matching.length!==1?'s':''} require materials from ${meta.name}
        </div>
      `;

      // animate in
      result.style.opacity='0'; result.style.transform='translateY(8px)';
      requestAnimationFrame(() => {
        result.style.transition='opacity 0.25s ease,transform 0.25s ease';
        result.style.opacity='1'; result.style.transform='translateY(0)';
      });
    }

    /* ── Artifact card entrance ── */
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); } });
    }, { threshold: 0.1 });
    document.querySelectorAll('.artifact-card').forEach((c, i) => {
      c.style.transitionDelay = (i * 70) + 'ms';
      io.observe(c);
    });

    /* ── Handle deep-link from levelguide ── */
    // If landed with ?dungeon=subway etc, switch to dungeon view automatically
    const params = new URLSearchParams(location.search);
    const deep = params.get('dungeon');
    if (deep && dungeonMeta[deep]) {
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
      document.querySelector('[data-view="dungeon"]').classList.add('active');
      document.getElementById('view-dungeon').classList.add('active');
      const tab = document.querySelector(`[data-dungeon="${deep}"]`);
      if (tab) { document.querySelectorAll('.dungeon-tab').forEach(t=>t.classList.remove('active')); tab.classList.add('active'); }
      renderMatrix(deep);
    } else {
      // Render default dungeon view in background so it's ready
      renderMatrix('subway');
    }
  </script>
</body>
</html>
